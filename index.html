<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" id="theme-color-meta" content="#10B981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="QATTAH — Split bills with friends, effortlessly">
  <title>QATTAH — Split Bills</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     SPLASH SCREEN
════════════════════════════════════════════════════════════ -->
<div class="splash" id="splash">
  <div class="splash-logo">
    <div class="splash-icon">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div class="splash-name">QATTAH</div>
    <div class="splash-tag">Split bills with friends</div>
  </div>
  <div class="splash-dots">
    <div class="splash-dot"></div>
    <div class="splash-dot"></div>
    <div class="splash-dot"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     MAIN APPLICATION
════════════════════════════════════════════════════════════ -->
<div id="app" class="hidden">

  <!-- ── Header ──────────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-logo" onclick="window.location.hash='#dashboard'">
      <div class="header-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      QATTAH
    </div>
    <div class="header-actions">
      <!-- Notifications -->
      <button class="icon-btn" id="notif-btn" title="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="badge" id="notif-badge" data-count="0"></span>
      </button>
      <!-- Theme toggle -->
      <button class="icon-btn" id="theme-btn" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
      <!-- Avatar -->
      <div class="person-avatar" id="header-avatar"
        style="width:36px;height:36px;font-size:.8rem;cursor:pointer"
        onclick="window.location.hash='#profile'">
        <span id="header-initials">?</span>
      </div>
    </div>
  </header>

  <!-- ── Notification panel ──────────────────────────────── -->
  <div class="notif-panel" id="notif-panel">
    <div class="notif-panel-hdr">
      <span style="font-weight:700;font-size:.9375rem">Notifications</span>
      <button class="section-link" id="notif-read-all">Mark all read</button>
    </div>
    <div class="notif-list"></div>
  </div>

  <!-- ── Page content (dynamic) ──────────────────────────── -->
  <main id="page-content" class="page-content"></main>

  <!-- ── Bottom Navigation ───────────────────────────────── -->
  <nav class="bottom-nav">
    <button class="nav-item" data-page="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="nav-lbl">Home</span>
    </button>

    <button class="nav-item" data-page="bills">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <span class="nav-lbl">Bills</span>
    </button>

    <!-- FAB: Add bill -->
    <div class="nav-fab-wrap">
      <button class="nav-fab-btn" id="fab-btn" title="Scan receipt">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
    </div>

    <button class="nav-item" data-page="groups">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span class="nav-lbl">Groups</span>
    </button>

    <button class="nav-item" data-page="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span class="nav-lbl">Profile</span>
    </button>
  </nav>

</div><!-- #app -->

<!-- ═══════════════════════════════════════════════════════════
     MODAL (bottom sheet)
════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title">Modal</h3>
      <button class="icon-btn" onclick="Modal.close()" style="width:32px;height:32px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-area" id="toast-area"></div>

<!-- ═══════════════════════════════════════════════════════════
     SCRIPTS
════════════════════════════════════════════════════════════ -->
<!-- Chart.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- QR code generator (for receipt share links) — vendored locally so it
     works offline / on restricted networks (the CDN build URL 404'd) -->
<script src="assets/js/qrcode.min.js"></script>

<!-- App scripts -->
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/dashboard.js"></script>
<script src="assets/js/bills.js"></script>
<script src="assets/js/groups.js"></script>
<script src="assets/js/profile.js"></script>
<script src="assets/js/analytics.js"></script>
<script src="assets/js/receipts.js"></script>
<script src="assets/js/admin.js"></script>

<script>
  // Register analytics page in router
  Pages.analytics = Pages.analytics || function() {};

  // Apply saved theme immediately (before app.js loads)
  (function() {
    const t = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    const l = localStorage.getItem('lang') || 'en';
    document.documentElement.setAttribute('lang', l);
    document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
  })();
</script>
</body>
</html>
