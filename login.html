<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10B981">
  <title>Login — QATTAH</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { display:flex; justify-content:center; }
    .auth-page { width:100%; max-width:480px; }
  </style>
</head>
<body>
  <div class="auth-page" id="auth-page">

    <!-- Top brand section -->
    <div class="auth-top">
      <div class="auth-logo-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="auth-app-name">QATTAH</div>
      <div class="auth-app-tag">Split bills with friends, effortlessly</div>
    </div>

    <!-- Form -->
    <div class="auth-form-wrap">
      <h2 class="auth-form-title">Welcome back 👋</h2>
      <p class="auth-form-sub">Sign in to your account to continue</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div class="input-wrap">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </div>
            <input class="form-control" id="email" type="email" name="email"
              autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="form-error hidden" id="email-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <input class="form-control" id="password" type="password" name="password"
              autocomplete="current-password" placeholder="••••••••" required>
            <button type="button" class="input-eye" id="toggle-pw">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="form-error hidden" id="pw-error"></div>
        </div>

        <div class="form-error hidden" id="form-error" style="margin-bottom:12px"></div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="auth-divider">or</div>

      <!-- Demo credentials hint -->
      <div style="background:var(--bg-input);border-radius:var(--radius);padding:14px;margin-bottom:16px">
        <div style="font-size:.8rem;font-weight:700;color:var(--text-muted);margin-bottom:6px">Demo Accounts</div>
        <div style="font-size:.8125rem;color:var(--text-muted)">
          <div>📧 ahmed@qattah.com</div>
          <div>🔒 password123</div>
        </div>
      </div>

      <p class="auth-switch">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>

  </div>

  <div id="toast-area" class="toast-area"></div>

  <script>
    // Apply saved theme
    const theme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);

    // Toggle password visibility
    document.getElementById('toggle-pw').addEventListener('click', function() {
      const pw = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        pw.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    });

    // Returns a safe same-origin redirect target from ?redirect=, or null.
    function safeRedirect() {
      const raw = new URLSearchParams(location.search).get('redirect');
      if (!raw) return null;
      try {
        const url = new URL(raw, location.href);
        return url.origin === location.origin ? url.href : null;
      } catch (_) { return null; }
    }

    // Toast helper
    function showToast(msg, type='error') {
      const area = document.getElementById('toast-area');
      const el   = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      area.appendChild(el);
      setTimeout(() => { el.classList.add('hiding'); setTimeout(()=>el.remove(),350); }, 3500);
    }

    // Form submit
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn   = document.getElementById('submit-btn');
      const email = document.getElementById('email').value.trim();
      const pw    = document.getElementById('password').value;

      if (!email) { showToast('Email is required'); return; }
      if (!pw)    { showToast('Password is required'); return; }

      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res  = await fetch('api/auth/login.php', {
          method:'POST',
          credentials:'include',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email, password: pw })
        });
        const data = await res.json();
        if (!data.success) { showToast(data.message || 'Login failed'); return; }
        window.location.href = safeRedirect() || 'index.html';
      } catch(_) {
        showToast('Network error — is the server running?');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
